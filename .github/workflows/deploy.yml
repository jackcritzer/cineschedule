name: Deploy

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build_push_deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # required for GHCR
      id-token: write
    env:
      PRISMA_HIDE_UPDATE_MESSAGE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set IMAGE_NAME (lowercased)
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # ---- Run migrations against prod DB ----
      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install deps for migrate
        run: npm ci

      - name: Prisma migrate deploy (prod)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx prisma migrate deploy --schema=./prisma/schema.prisma

      # ---- Trigger Render deploy ----
      - name: Trigger Render deploy (image service)
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          set -euo pipefail

          IMAGE_SHA_TAG="ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA::7}"
          echo "Triggering Render with image: $IMAGE_SHA_TAG"

          JSON_PAYLOAD=$(printf '{"clearCache":false,"imageUrl":"%s"}' "$IMAGE_SHA_TAG")

          HTTP_CODE=$(curl -sS -o /tmp/render_resp.json -w "%{http_code}" \
            -X POST "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            --data "$JSON_PAYLOAD")

          echo "Render responded with HTTP $HTTP_CODE"
          cat /tmp/render_resp.json

          if [ "${HTTP_CODE}" -lt 200 ] || [ "${HTTP_CODE}" -ge 300 ]; then
            echo "Render deploy API failed"
            exit 1
          fi


      # ---- (Optional) Verify status (best-effort) ----
      - name: Print Render deploy note
        run: echo "Deploy triggered on Render. Check dashboard for status."
