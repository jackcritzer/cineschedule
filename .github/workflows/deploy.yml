name: Deploy API to Render
on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build_and_push_image:
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    outputs:
      image_sha_tag: ${{ steps.meta.outputs.image_sha_tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Build image
        id: meta
        run: |
          IMAGE_SHA_TAG="ghcr.io/${{ github.repository }}:sha-${GITHUB_SHA::7}"
          echo "image_sha_tag=$IMAGE_SHA_TAG" >> $GITHUB_OUTPUT
          docker build -t "$IMAGE_SHA_TAG" .
      - name: Push image
        run: docker push "${{ steps.meta.outputs.image_sha_tag }}"

  migrate_prod:
    needs: build_and_push_image
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://api.cineschedule.com
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Use Node 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Optional but recommended: use your repo's Prisma version
      - name: Install deps (for Prisma CLI version pin)
        run: npm ci

      # (Optional) Sanity: show prisma folder exists
      - name: List prisma dir
        run: ls -la prisma

      - name: Run Prisma migrate on PROD
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}     # env secret in "production"
          PRISMA_HIDE_UPDATE_MESSAGE: "1"
        run: npx prisma migrate deploy --schema=./prisma/schema.prisma

  deploy_to_render:
    needs: [build_and_push_image, migrate_prod]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy with this image
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          IMAGE_SHA_TAG: ${{ needs.build_and_push_image.outputs.image_sha_tag }}
        run: |
          JSON_PAYLOAD=$(printf '{"clearCache":false,"imageUrl":"%s"}' "$IMAGE_SHA_TAG")
          curl -fsSL -X POST \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -d "$JSON_PAYLOAD" \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys"
