name: Deploy API to Render (pinned image tag)

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  build_and_push_image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_sha_tag: ${{ steps.set_out.outputs.image_sha_tag }}
    env:
      PRISMA_HIDE_UPDATE_MESSAGE: "1"
      NODE_ENV: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps & generate Prisma client
        run: |
          npm ci
          npx prisma generate

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true
          driver: docker-container
          driver-opts: image=moby/buildkit:latest

      # 🧩 NEW STEP: Generate tags + labels automatically
      - name: Extract Docker metadata (tags + labels)
        id: meta_labels
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
          labels: |
            org.opencontainers.image.title=CineSchedule API
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=CineSchedule backend service (Express + Prisma)
            org.opencontainers.image.licenses=MIT

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          builder: ${{ steps.buildx.outputs.name }}
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta_labels.outputs.tags }}
          labels: ${{ steps.meta_labels.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Set pinned image tag output
        id: set_out
        run: echo "image_sha_tag=$(echo '${{ steps.meta_labels.outputs.tags }}' | head -n1)" >> "$GITHUB_OUTPUT"


  migrate_prod:
    needs: build_and_push_image
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://api.cineschedule.com
    env:
      PRISMA_HIDE_UPDATE_MESSAGE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install (pin Prisma CLI version)
        run: npm ci

      - name: Run Prisma migrate on PROD
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}   # set this on the "production" environment
        run: npx prisma migrate deploy --schema=./prisma/schema.prisma

  deploy_to_render:
    needs: [build_and_push_image, migrate_prod]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy with pinned imageUrl
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          IMAGE_SHA_TAG: ${{ needs.build_and_push_image.outputs.image_sha_tag }}   # <- this will be non-empty now
        run: |
          echo "Deploying image: $IMAGE_SHA_TAG"
          JSON_PAYLOAD=$(printf '{"imageUrl":"%s"}' "$IMAGE_SHA_TAG")
          set -o pipefail
          curl -sS -D >(tee /tmp/render-headers.txt) \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -d "$JSON_PAYLOAD" \
            -o /tmp/render-body.json \
            -w "\nHTTP_STATUS=%{http_code}\n" \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" | tee /tmp/render-status.txt

          echo "--- Render response body ---"
          cat /tmp/render-body.json
          echo "--- Render response status ---"
          STATUS=$(grep HTTP_STATUS /tmp/render-status.txt | sed 's/HTTP_STATUS=//')
          echo "$STATUS"
          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ]; then
            echo "Render deploy failed with status $STATUS"
            exit 1
          fi

      - name: Post-deploy smoke check
        env:
          HEALTH_URL: ${{ vars.RENDER_HEALTH_URL || secrets.RENDER_HEALTH_URL }}
        run: |
          set -euo pipefail

          if [ -z "${HEALTH_URL:-}" ]; then
            echo "HEALTH_URL is empty. Set it as an Environment Variable (vars) or Secret."
            exit 1
          fi

          echo "Health URL: $HEALTH_URL"
          for i in $(seq 1 20); do
            echo "Health attempt $i..."
            # -f: fail on >=400, -s: silent, -S: show errors
            BODY="$(curl -fsS "$HEALTH_URL" || true)"
            if printf '%s' "$BODY" | grep -q '"ok":\s*true'; then
              echo "Healthy ✅"
              exit 0
            fi
            sleep 5
          done

          echo "Service not healthy after timeout"
          exit 1