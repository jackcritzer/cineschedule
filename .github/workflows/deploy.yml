name: Deploy

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build_push_deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # required for GHCR
      id-token: write
    env:
      PRISMA_HIDE_UPDATE_MESSAGE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set IMAGE_NAME (lowercased)
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # ---- Run migrations against prod DB ----
      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install deps for migrate
        run: npm ci

      - name: Prisma migrate deploy (prod)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx prisma migrate deploy --schema=./prisma/schema.prisma

      - name: Render Deploy Action
        uses: johnbeynon/render-deploy-action@v0.0.8
        with:
            service-id: ${{ secrets.RENDER_SERVICE_ID }}
            api-key: ${{ secrets.RENDER_API_KEY }}

      # ---- (Optional) Verify status (best-effort) ----
      - name: Print Render deploy note
        run: echo "Deploy triggered on Render. Check dashboard for status."
