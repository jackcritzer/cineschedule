name: CI

on:
  pull_request:
  push:
    branches: [ "**" ]

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      PRISMA_HIDE_UPDATE_MESSAGE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: Setup test env
        run: |
          cp .env.test.example .env.test 2>/dev/null || true
          echo "TMDB_API_KEY=dummy" >> .env.test
          echo "DEFAULT_REGION=US" >> .env.test
          echo "JWT_KEYS=dev_kid=dev_secret" >> .env.test
          echo "JWT_CURRENT_KID=dev_kid" >> .env.test
          echo "DATABASE_URL=postgres://user:pass@localhost:5432/testdb" >> .env.test

      - name: Prisma generate
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: pnpm vitest --run --coverage

      - name: Build
        run: npm run build