services:
  db:
    image: postgres:16-alpine
    container_name: cineschedule_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cineschedule_dev
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cineschedule_dev"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  dbdata: