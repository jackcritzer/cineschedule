services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cineschedule
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cineschedule"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      target: dev         # 👈 use the dev stage
    env_file: .env
    ports: ["3000:3000"]
    depends_on: [db]
    volumes:
      - .:/app            # mount your code
      - /app/node_modules # keep container's node_modules (don’t shadow with host)
    command: npm run dev

volumes:
  pgdata:
