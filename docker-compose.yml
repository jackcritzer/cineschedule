services:
  db:
    image: postgres:16-alpine
    container_name: cineschedule-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cineschedule
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cineschedule"]
      interval: 5s
      timeout: 3s
      retries: 20
  
  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - db
    env_file: .env         # <— loads your local .env (gitignored)
    ports:
      - "3000:3000"
    command: ["npm", "run", "dev"] # or "start" for prod-like
    volumes:
      - .:/app
      - /app/node_modules  # prevent host node_modules from shadowing
      
volumes:
  pgdata: