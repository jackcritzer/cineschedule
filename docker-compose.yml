version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cineschedule
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cineschedule"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      target: dev            # 👈 keep using the dev stage
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - .:/app               # mount source code
      - /app/node_modules    # keep container's node_modules
    command: npm run dev

volumes:
  pgdata:
